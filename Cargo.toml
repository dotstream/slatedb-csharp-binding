[workspace]
resolver = "2"
members = [
    "rust/slatedb-ffi"
]

[profile.dev]
debug = true

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Sylvain Le Gouellec <sylvain.legouellec@gmail.com>"]
description = "C# UniFFI bindings for SlateDB"
license = "Apache-2.0"
repository = "https://github.com/dotstream/slatedb-csharp-binding"
readme = "README.md"

[workspace.dependencies]
figment = "0.10.19"