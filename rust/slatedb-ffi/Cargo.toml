[package]
name = "slatedb-csharp-ffi"
version = "0.1.0"
edition = "2021"
authors = ["Sylvain Le Gouellec <sylvain.legouellec@gmail.com>"]
description = "Uniffi C# FFI bindings for Slatedb"
license = "Apache-2.0"
repository = "https://github.com/dotstream/slatedb-csharp-binding"
readme = "../../README.md"
keywords = ["slatedb", "ffi", "csharp", "bindings"]
build = "build.rs"

[lib]
name = "slatedb_csharp_ffi"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies] 
bytes = "1.7.1"
chrono = "0.4.41"
slatedb = { version = "0.16.0", features = ["all"] }
slatedb-common = "0.16.0"
# once_cell = "1.21.3"
moka = { version = "0.12.8", features = ["sync"] }
object_store = { version = "0.14.0" , features = ["azure", "aws", "fs", "gcp"]}
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync"] }
serde_json = "1.0.142"
log = "0.4.27"
env_logger = "0.11"
uuid = "1.18.0"
humantime = "2.1.0"
tracing = "0.1.40"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
thiserror = "1.0.63"
parking_lot = "0.12.4"
uniffi = { version="0.31.0", features = ["tokio"]}
ulid = "1.2.1"

[dev-dependencies]
figment = { workspace = true, features = ["test"] }

[build-dependencies]
csbindgen = "1.9.7"